
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | DBS-BANK</title>
    <link rel="stylesheet" href="logout.css">
</head>
<body>

<header class="header">
    <div class="logo">DBS<span>BANK</span></div>
</header>

<main class="logout-container">

    <section class="logout-card">

        <div class="logout-icon">👋</div>

        <h1>Logout of DBS-BANK?</h1>

        <p>
            Are you sure you want to end your current demo session?
        </p>

        <button id="logoutBtn" class="logout-btn" type="button">
            Yes, Logout
        </button>

        <a href="index.html" class="cancel-link">
            Cancel and Return Home
        </a>

        <p id="message" aria-live="polite"></p>

        <p class="demo-notice">
            Demo logout only. Saved demo profile and transaction
            information will remain in this browser.
        </p>

    </section>

</main>

<script src="logout.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | DBS-BANK</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

<header class="header">
    <div class="logo">DBS<span>BANK</span></div>
    <a href="login.html">Back to Login</a>
</header>

<main class="recovery-container">

    <section class="recovery-card">
        <div class="icon">🔐</div>

        <h1>Forgot Your Password?</h1>

        <p class="intro">
            Enter the email address associated with your demo account.
        </p>

        <form id="recoveryForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Continue
            </button>

            <p id="message" aria-live="polite"></p>

        </form>

        <a href="login.html" class="back-link">
            Return to Login
        </a>

        <p class="demo-notice">
            Demo only: this page does not send password reset emails
            or change account passwords.
        </p>
    </section>

</main>

<script src="forgot-password.js"></script>
</body>
</html>
